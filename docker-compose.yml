services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: insurtech-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16
    container_name: insurtech-postgres
    environment:
      POSTGRES_DB: insurtech
      POSTGRES_USER: insurtech
      POSTGRES_PASSWORD: insurtech
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  qdrant_data:
  postgres_data: